<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In-Game Chart — self test</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .runner { padding: 1rem; max-width: 900px; margin: 0 auto; }
  .t { padding: .45rem .6rem; border-left: 4px solid var(--good); background: var(--paper);
       border: 1px solid var(--line); border-left-width: 4px; border-radius: 6px; margin-bottom: .3rem; }
  .t.bad { border-left-color: var(--bad); background: var(--bad-soft); }
  .t .why { font-family: var(--mono); font-size: .82rem; color: var(--bad); white-space: pre-wrap; margin-top: .3rem; }
  .summary { font-size: 1.3rem; font-weight: 800; margin: 1rem 0; }
  .summary.ok { color: var(--good); }
  .summary.bad { color: var(--bad); }
</style>
</head>
<body class="mode-desktop">
<div class="runner">
  <h1>In-Game Chart — self test</h1>
  <p class="hint">Checks the field-position math, down &amp; distance, penalties, the box score and the
    recalculation rules. Open this after any change; everything must be green.</p>
  <div class="summary" id="summary">Running…</div>
  <div id="results"></div>
</div>

<script src="js/dom.js"></script>
<script src="js/model.js"></script>
<script src="js/engine.js"></script>
<script src="js/tests.js"></script>
<script>
(function () {
  var res = FB.Tests.run();
  var host = document.getElementById('results');
  res.results.forEach(function (r) {
    var div = document.createElement('div');
    div.className = 't' + (r.ok ? '' : ' bad');
    div.textContent = (r.ok ? 'PASS  ' : 'FAIL  ') + r.name;
    if (!r.ok) {
      var why = document.createElement('div');
      why.className = 'why';
      why.textContent = r.error;
      div.appendChild(why);
    }
    host.appendChild(div);
  });
  var sum = document.getElementById('summary');
  sum.textContent = res.passed + ' passed, ' + res.failed + ' failed';
  sum.className = 'summary ' + (res.failed ? 'bad' : 'ok');
  document.title = (res.failed ? 'FAIL' : 'PASS') + ' — self test';
})();
</script>
</body>
</html>
